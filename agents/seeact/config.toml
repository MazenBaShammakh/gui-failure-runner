# SeeAct agent configuration — matches SeeActAgent.__init__ parameter structure.
# Sections and keys must match exactly; missing keys fall back to constructor defaults.

[basic]
save_file_dir      = "seeact_test_output"
default_task       = "Search for the current weather in Munich"
default_website    = "https://www.accuweather.com/"
crawler_mode       = false
crawler_max_steps  = 10

[agent]
input_info           = ["screenshot"]
grounding_strategy   = "text_choice_som"
max_auto_op          = 50
max_continuous_no_op = 5
highlight            = false

[openai]
rate_limit  = -1
model       = "gemini-flash-latest"
temperature = 0.9
# api_key is intentionally omitted — set OPENAI_API_KEY in your environment or .env
