api_key = "AIzaSyChopED94sBnPd_lVpG_BzDWFkmqnFfSjg"

[browser]
headless             = true
args                 = []
browser_app          = "chrome"
persistant           = false
persistant_user_path = ""
save_video           = false
tracing              = false

[browser.viewport]
width  = 1536
height = 1024

[browser.trace]
screenshots = true
snapshots   = true
sources     = true
